name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: bash
        run: gcc -std=c11 -Wall -Wextra -Wpedantic Finalcopy.c -lm -o engineering-calculator
